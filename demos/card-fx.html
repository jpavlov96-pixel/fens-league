<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Card Effects · Fens League</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,800;1,800&display=swap" rel="stylesheet">
  <!-- A proposal for the card picker (Избери Коз), 2026-11-16: three edge effects for the middle
       card and the "Приложи Коз" slam. Not linked from the site; kept off it (.assetsignore). -->
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { background: #0c0c0c; }
    body {
      min-height: 100vh;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    .page { max-width: 375px; margin: 0 auto; padding: 16px 16px 40px; }
    h1 { font-family: "Montserrat", sans-serif; font-size: 20px; font-weight: 900; }
    .lead { margin-top: 4px; font-size: 12px; color: #929295; }

    /* the three options */
    .tabs { display: flex; gap: 6px; margin-top: 16px; }
    .tabs button {
      flex: 1 0 0;
      height: 34px;
      border: 1px solid #ffffff1f;
      border-radius: 60px;
      background: #ffffff0a;
      font: inherit;
      font-size: 12px;
      color: #c9c9c9;
      cursor: pointer;
    }
    .tabs button.is-on { border-color: #f5d584; color: #f5d584; }
    .tabs--small { margin-top: 6px; }
    .tabs--small button { height: 28px; font-size: 11px; color: #929295; }
    .strength { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 12px; color: #b3b3b3; }
    .strength input { flex: 1 0 0; accent-color: #f5d584; }
    .arc { fill: none; stroke: #fffaf0; stroke-width: 1.3; stroke-linejoin: bevel; filter: url(#soft); }
    .arc-glow { fill: none; stroke: #f5d584; stroke-width: 4; stroke-linejoin: round; opacity: 0.55; filter: url(#volt-glow); }
    .hot { fill: #fff2c4; filter: url(#volt-glow); }
    .note { min-height: 48px; margin-top: 10px; font-size: 12px; line-height: 16px; color: #b3b3b3; }

    /* the stage: the sheet's dark gradient */
    .stage {
      position: relative;
      height: 420px;
      margin-top: 8px;
      border-top: 3px solid #3e3e3e;
      border-radius: 12px 12px 0 0;
      background: radial-gradient(120% 90% at 50% 100%, #000000 0%, #0c0c0c 40%, #171717 80%);
      overflow: hidden;
    }

    /* the card: 179 × 269, as the picker's middle card */
    .card {
      position: absolute;
      top: 40px;
      left: 50%;
      width: 179px;
      height: 269px;
      margin-left: -89.5px;
      transform-origin: 50% 60%;
    }
    .card__art { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 10px; }
    .card__name {
      position: absolute;
      right: 0;
      bottom: 36px;
      left: 0;
      font-family: "Montserrat", sans-serif;
      font-size: 22.5px;
      font-style: italic;
      font-weight: 800;
      line-height: 1.05;
      text-align: center;
      font-feature-settings: "locl" 0;
    }
    .card__fx { position: absolute; top: -14px; left: -14px; width: 207px; height: 297px; overflow: visible; pointer-events: none; }

    /* A: high voltage, gold lightning crawling along the edge (SVG turbulence, reseeded) */
    .card__fx .glow { filter: url(#volt-glow); }

    /* B: a comet of light running around the edge, with a softer one behind */
    .fx-comet path { stroke-dasharray: 90 910; animation: comet 2.6s linear infinite; }
    .fx-comet path.trail { stroke-dasharray: 220 780; animation: comet 2.6s linear infinite; opacity: 0.35; }
    .fx-comet path.second { animation-delay: -1.3s; }
    @keyframes comet { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -1000; } }

    /* C: the gold edge breathes, brighter every few seconds */
    .fx-pulse path { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes pulse {
      0%, 100% { opacity: 0.25; stroke-width: 2; }
      50% { opacity: 1; stroke-width: 3; }
    }

    /* the buttons, as in the picker */
    .btns { position: absolute; right: 7px; bottom: 16px; left: 7px; display: flex; justify-content: space-between; }
    .back, .apply {
      height: 42px;
      padding: 8px 32px;
      border-radius: 60px;
      font: inherit;
      font-size: 15px;
      cursor: pointer;
    }
    .back { width: 130px; border: 1px solid #ffffff0d; background: none; color: #c9c9c9; }
    .apply {
      width: 167px;
      border: 1px solid #ffffff26;
      background: #19b14e;
      box-shadow: 0 0 6px #19b14ebf;
      font-weight: 500;
      color: #ffffff;
      text-shadow: 0 0 3px #00000059;
    }

    /* the slam's pieces */
    .flash { position: absolute; inset: 0; background: #fff3cf; opacity: 0; pointer-events: none; }
    .ring {
      position: absolute;
      width: 60px;
      height: 60px;
      margin: -30px 0 0 -30px;
      border: 3px solid #f5d584;
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
    }
    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      margin: -2px 0 0 -2px;
      border-radius: 50%;
      background: #ffe6a3;
      box-shadow: 0 0 6px #f5d584;
      pointer-events: none;
    }
    .options { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #b3b3b3; }
    .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="page">
    <h1>Ефекти за коза</h1>
    <p class="lead">Предложение за „Избери Коз“: ефект по ръба на средната карта и удар при „Приложи Коз“.</p>

    <div class="tabs" role="tablist">
      <button type="button" class="is-on" data-fx="storm">A2 · Буря</button>
      <button type="button" data-fx="stormBranch">A2b · Клони</button>
      <button type="button" data-fx="stormArc">A2c · Дъги</button>
    </div>
    <div class="tabs tabs--small" role="tablist">
      <button type="button" data-fx="volt">A1 · Ток</button>
      <button type="button" data-fx="surge">A3 · Вълна</button>
      <button type="button" data-fx="charge">A4 · Заряд</button>
      <button type="button" data-fx="comet">B · Комета</button>
      <button type="button" data-fx="pulse">C</button>
    </div>
    <label class="strength">Сила <input type="range" id="strength" min="0.4" max="1.8" step="0.1" value="1"> <span id="strength-val">1.0</span></label>
    <p class="note" id="note"></p>

    <div class="stage" id="stage">
      <div class="card" id="card">
        <img class="card__art" src="../assets/trump-cards/rest.webp" alt="">
        <p class="card__name">ПОЧИВКА</p>
        <svg class="card__fx" id="fx" viewBox="-14 -14 207 297" aria-hidden="true">
          <defs>
            <!-- A: the line is pushed about by noise; the seed changes ~16 times a second -->
            <filter id="volt" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence id="volt-noise" type="turbulence" baseFrequency="0.045" numOctaves="2" seed="1" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
            </filter>
            <filter id="volt2" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence id="volt-noise2" type="turbulence" baseFrequency="0.09" numOctaves="1" seed="7" result="n"/>
              <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="G" yChannelSelector="R"/>
            </filter>
            <filter id="volt-glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="4"/>
            </filter>
            <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="3" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <g id="fx-body"></g>
        </svg>
      </div>
      <div class="btns">
        <button class="back" type="button">← Назад</button>
        <button class="apply" type="button" id="apply">Приложи Коз</button>
      </div>
      <div class="flash" id="flash"></div>
    </div>

    <div class="options">
      <label><input type="checkbox" id="opt-sound" checked> Звук (тъп удар)</label>
      <label><input type="checkbox" id="opt-buzz" checked> Вибрация (Android)</label>
    </div>
  </div>

  <script>
    (function () {
      // the card's frame: a rectangle with cut corners, like the card art's own frame
      function edge() {
        var w = 179, h = 269, c = 12;
        return 'M' + c + ',0 H' + (w - c) + ' L' + w + ',' + c + ' V' + (h - c) + ' L' + (w - c) + ',' + h +
          ' H' + c + ' L0,' + (h - c) + ' V' + c + ' Z';
      }
      var D = edge();
      var body = document.getElementById('fx-body');
      var note = document.getElementById('note');
      var voltTimer = null;

      var VOLT = '<path d="' + D + '" fill="none" stroke="#f5d584" stroke-width="2.2" filter="url(#volt)"/>' +
                 '<path d="' + D + '" fill="none" stroke="#fff6dc" stroke-width="1" filter="url(#volt)" opacity="0.9"/>';
      var FX = {
        volt: {
          note: 'A1 · Ток: златен ток пълзи по ръба и пращи на случайни места (първият вариант).',
          svg: '<path class="glow" d="' + D + '" fill="none" stroke="#f5d584" stroke-width="6" opacity="0.55"/>' + VOLT
        },
        stormBranch: {
          note: 'A2b · Клони: като Буря, но всяка мълния се разклонява и при удар целият ръб проблясва, с горещо петно на мястото.',
          svg: null
        },
        stormArc: {
          note: 'A2c · Дъги: токът „прескача“ по ръба с дъги между две точки, като на Тесла бобина; от време на време по-голяма дъга през ъгъла.',
          svg: null
        },
        storm: {
          note: 'A2 · Буря (по-изчистена): плавно трептене вместо резки скокове, мълниите са с бяло ядро и златен ореол, ударите идват на неравни интервали.',
          svg: '<path class="glow" d="' + D + '" fill="none" stroke="#f5d584" stroke-width="8" opacity="0.6"/>' +
               '<path d="' + D + '" fill="none" stroke="#f5d584" stroke-width="2.6" filter="url(#volt)"/>' +
               '<path d="' + D + '" fill="none" stroke="#ffe7a8" stroke-width="1.6" filter="url(#volt2)" opacity="0.8"/>' +
               '<path d="' + D + '" fill="none" stroke="#ffffff" stroke-width="0.9" filter="url(#volt)"/>' +
               '<g id="arcs"></g>'
        },
        surge: {
          note: 'A3 · Вълна: тих ток по целия ръб и мощен импулс, който обикаля картата и пръска искри след себе си.',
          svg: '<path d="' + D + '" fill="none" stroke="#f5d584" stroke-width="1.4" filter="url(#volt2)" opacity="0.55"/>' +
               '<path class="surge-glow" d="' + D + '" pathLength="1000" fill="none" stroke="#f5d584" stroke-width="7" opacity="0.7" filter="url(#volt-glow)"/>' +
               '<path class="surge" d="' + D + '" pathLength="1000" fill="none" stroke="#fff6dc" stroke-width="2.4" stroke-linecap="round" filter="url(#volt)"/>' +
               '<g id="arcs"></g>'
        },
        charge: {
          note: 'A4 · Заряд: картата се „зарежда“: токът се усилва за около 2 секунди, избухва с мълнии и започва отначало.',
          svg: '<path class="glow" d="' + D + '" fill="none" stroke="#f5d584" stroke-width="6" opacity="0.55"/>' + VOLT + '<g id="arcs"></g>'
        },
        comet: {
          note: 'B · Комета: две светли „комети“ обикалят ръба на картата.',
          svg: '<path class="trail" d="' + D + '" pathLength="1000" fill="none" stroke="#f5d584" stroke-width="3" filter="url(#soft)"/>' +
               '<path d="' + D + '" pathLength="1000" fill="none" stroke="#fff6dc" stroke-width="2.5" stroke-linecap="round" filter="url(#soft)"/>' +
               '<path class="trail second" d="' + D + '" pathLength="1000" fill="none" stroke="#f5d584" stroke-width="3" filter="url(#soft)"/>' +
               '<path class="second" d="' + D + '" pathLength="1000" fill="none" stroke="#fff6dc" stroke-width="2.5" stroke-linecap="round" filter="url(#soft)"/>'
        },
        pulse: {
          note: 'C · Пулс: златният ръб диша бавно.',
          svg: '<path d="' + D + '" fill="none" stroke="#f5d584" filter="url(#soft)"/>'
        }
      };

      // a path along the edge, to find points on it
      var probe = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      probe.setAttribute('d', D);
      var EDGE = 0;
      var CX = 89.5, CY = 134.5; // the card's centre
      function edgePoint(t) {
        if (!EDGE) EDGE = probe.getTotalLength();
        return probe.getPointAtLength(((t % 1) + 1) % 1 * EDGE);
      }

      // a jagged bolt jumping out of the edge at t (0…1), away from the centre
      function arc(t, len, life) {
        var g = document.getElementById('arcs');
        if (!g) return;
        var p = edgePoint(t);
        var dx = p.x - CX, dy = p.y - CY, d = Math.sqrt(dx * dx + dy * dy) || 1;
        dx /= d; dy /= d;
        var pts = [[p.x, p.y]], x = p.x, y = p.y, steps = 4;
        for (var i = 1; i <= steps; i++) {
          x += dx * len / steps + (Math.random() - 0.5) * 9;
          y += dy * len / steps + (Math.random() - 0.5) * 9;
          pts.push([x, y]);
        }
        var el = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        el.setAttribute('class', 'arc');
        el.setAttribute('points', pts.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' '));
        g.appendChild(el);
        el.animate([{ opacity: 1 }, { opacity: 0.9, offset: 0.4 }, { opacity: 0 }], { duration: life, easing: 'ease-out' }).onfinish = function () { el.remove(); };
      }

      FX.stormBranch.svg = FX.storm.svg;
      FX.stormArc.svg = FX.storm.svg;

      // a bolt as a glowing gold stroke with a white core; pts = [[x,y], …]
      function bolt(pts, life, width) {
        var g = document.getElementById('arcs');
        if (!g) return;
        var d = pts.map(function (q) { return q[0].toFixed(1) + ',' + q[1].toFixed(1); }).join(' ');
        [['arc-glow', 1], ['arc', width || 1]].forEach(function (k) {
          var el = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
          el.setAttribute('class', k[0]);
          el.setAttribute('points', d);
          if (k[0] === 'arc') el.style.strokeWidth = String(1.3 * k[1]);
          g.appendChild(el);
          el.animate([{ opacity: 1 }, { opacity: 0.85, offset: 0.35 }, { opacity: 0 }],
            { duration: life, easing: 'cubic-bezier(0.2, 0.6, 0.3, 1)' }).onfinish = function () { el.remove(); };
        });
      }

      // jagged points from (x,y) along (dx,dy) for len px
      function jag(x, y, dx, dy, len, steps, wobble) {
        var pts = [[x, y]];
        for (var i = 1; i <= steps; i++) {
          x += dx * len / steps + (Math.random() - 0.5) * wobble;
          y += dy * len / steps + (Math.random() - 0.5) * wobble;
          pts.push([x, y]);
        }
        return pts;
      }

      function outward(p) {
        var dx = p.x - CX, dy = p.y - CY, d = Math.sqrt(dx * dx + dy * dy) || 1;
        return [dx / d, dy / d];
      }

      // the edge flares for a moment (the glow layer), with a hot spot where the bolt left
      function flare(p) {
        var glow = body.querySelector('.glow');
        if (glow) glow.animate([{ opacity: 1, strokeWidth: '11px' }, { opacity: 0.6, strokeWidth: '8px' }],
          { duration: 260, easing: 'ease-out' });
        var g = document.getElementById('arcs');
        if (!g || !p) return;
        var c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        c.setAttribute('class', 'hot');
        c.setAttribute('cx', p.x);
        c.setAttribute('cy', p.y);
        c.setAttribute('r', '5');
        g.appendChild(c);
        c.animate([{ opacity: 1, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(2.2)' }],
          { duration: 300, easing: 'ease-out', transformOrigin: p.x + 'px ' + p.y + 'px' }).onfinish = function () { c.remove(); };
      }

      // a branching strike out of the edge
      function strike(t, big) {
        var p = edgePoint(t), o = outward(p);
        var len = (big ? 26 : 16) * strength;
        var main = jag(p.x, p.y, o[0], o[1], len, 5, 8);
        bolt(main, big ? 260 : 190, big ? 1.4 : 1);
        // one or two branches from the middle of the main bolt, bent sideways
        var n = big ? 2 : 1;
        for (var i = 0; i < n; i++) {
          var from = main[2 + i];
          var side = (Math.random() < 0.5 ? -1 : 1) * 0.8;
          var bx = o[0] + -o[1] * side, by = o[1] + o[0] * side;
          var bl = Math.sqrt(bx * bx + by * by);
          bolt(jag(from[0], from[1], bx / bl, by / bl, len * 0.5, 3, 6), big ? 220 : 160, 0.7);
        }
        if (big) flare(p);
      }

      // an arc jumping between two points on the edge, bowing outward
      function edgeArc(t, span, life) {
        var a = edgePoint(t), b = edgePoint(t + span), m = edgePoint(t + span / 2), o = outward(m);
        var bow = (8 + Math.random() * 6) * strength;
        var pts = [], steps = 7;
        for (var i = 0; i <= steps; i++) {
          var k = i / steps;
          var x = a.x + (b.x - a.x) * k + o[0] * bow * Math.sin(Math.PI * k);
          var y = a.y + (b.y - a.y) * k + o[1] * bow * Math.sin(Math.PI * k);
          if (i && i < steps) { x += (Math.random() - 0.5) * 5; y += (Math.random() - 0.5) * 5; }
          pts.push([x, y]);
        }
        bolt(pts, life, 1.1);
      }

      var strength = 1;
      var timers = [];
      var raf = 0;
      function stopAll() {
        timers.forEach(function (t) { if (t && t.stop) t.stop(); else { clearInterval(t); clearTimeout(t); } });
        timers = [];
        cancelAnimationFrame(raf);
      }

      // the storm's flicker: the line's shake eases toward a new target instead of jumping.
      // The filter is redrawn ~14 times a second, not every frame (it's expensive)
      function smoothNoise(mul) {
        var n1 = document.getElementById('volt-noise'), n2 = document.getElementById('volt-noise2');
        var d1 = n1.parentNode.lastElementChild, d2 = n2.parentNode.lastElementChild;
        var cur = 7;
        timers.push(setInterval(function () {
          n1.setAttribute('seed', String(Math.floor(Math.random() * 1000)));
          n2.setAttribute('seed', String(Math.floor(Math.random() * 1000)));
          var target = (6 + Math.random() * 4) * mul * strength;
          cur += (target - cur) * 0.5;
          d1.setAttribute('scale', cur.toFixed(2));
          d2.setAttribute('scale', (cur * 0.7).toFixed(2));
        }, 70));
      }

      // strikes at uneven intervals
      function every(min, max, fn) {
        var alive = true;
        (function next() {
          var id = setTimeout(function () {
            var i = timers.indexOf(id);
            if (i >= 0) timers.splice(i, 1);
            if (!alive) return;
            fn();
            next();
          }, min + Math.random() * (max - min));
          timers.push(id);
        })();
        timers.push({ stop: function () { alive = false; } });
      }

      function noiseLoop(seconds) {
        var n1 = document.getElementById('volt-noise'), n2 = document.getElementById('volt-noise2');
        timers.push(setInterval(function () {
          n1.setAttribute('seed', String(Math.floor(Math.random() * 1000)));
          n2.setAttribute('seed', String(Math.floor(Math.random() * 1000)));
          var crack = Math.random() < 0.12;
          n1.parentNode.lastElementChild.setAttribute('scale', String((crack ? 14 : 7) * strength * (seconds || 1)));
          n2.parentNode.lastElementChild.setAttribute('scale', String(5 * strength));
        }, 60));
      }

      function show(name) {
        stopAll();
        document.getElementById('fx').setAttribute('class', 'card__fx fx-' + name);
        body.innerHTML = FX[name].svg;
        note.textContent = FX[name].note;
        document.querySelectorAll('.tabs button').forEach(function (b) {
          b.classList.toggle('is-on', b.getAttribute('data-fx') === name);
        });
        if (name === 'volt') noiseLoop();
        if (name === 'storm') {
          smoothNoise(1.1);
          // small bolts at uneven intervals, now and then a bigger one with a flare
          every(140, 420, function () {
            var t = Math.random();
            bolt(jag(edgePoint(t).x, edgePoint(t).y, outward(edgePoint(t))[0], outward(edgePoint(t))[1], (10 + Math.random() * 12) * strength, 4, 8), 180, 1);
            if (Math.random() < 0.18) { flare(edgePoint(t)); }
          });
        }
        if (name === 'stormBranch') {
          smoothNoise(1.1);
          every(260, 700, function () { strike(Math.random(), Math.random() < 0.3); });
        }
        if (name === 'stormArc') {
          smoothNoise(0.9);
          every(120, 380, function () { edgeArc(Math.random(), 0.02 + Math.random() * 0.03, 170); });
          // now and then a big arc across a corner
          var CORNERS = [0.01, 0.27, 0.5, 0.77];
          every(1400, 2600, function () {
            var c = CORNERS[Math.floor(Math.random() * 4)];
            edgeArc(c - 0.04, 0.09, 260);
            flare(edgePoint(c + 0.005));
          });
        }
        if (name === 'surge') {
          noiseLoop(0.8);
          // the pulse: a bright, crackling stretch going round in 1.8s, sparks off its head
          var head = body.querySelector('.surge'), glow = body.querySelector('.surge-glow');
          head.style.strokeDasharray = '110 890';
          glow.style.strokeDasharray = '160 840';
          var start = performance.now();
          (function step(now) {
            var t = ((now - start) / 1800) % 1;
            head.style.strokeDashoffset = String(-t * 1000);
            glow.style.strokeDashoffset = String(-t * 1000 + 25);
            if (Math.random() < 0.35 * strength) arc(t + 0.1, 6 + Math.random() * 10 * strength, 140);
            raf = requestAnimationFrame(step);
          })(start);
        }
        if (name === 'charge') {
          // builds up over 2.2s (the line shakes harder, the glow brightens), then a burst of bolts
          var g = body.querySelector('.glow');
          var n1 = document.getElementById('volt-noise');
          var t0 = performance.now();
          (function step(now) {
            var k = ((now - t0) % 2600) / 2200; // 0 → 1 the build-up, then a short rest
            if (k <= 1) {
              n1.setAttribute('seed', String(Math.floor(now / 60)));
              n1.parentNode.lastElementChild.setAttribute('scale', String((3 + 13 * k * k) * strength));
              g.setAttribute('opacity', String(0.2 + 0.7 * k));
              g.setAttribute('stroke-width', String(4 + 8 * k));
              if (k > 0.97 && !step.fired) {
                step.fired = true;
                for (var i = 0; i < 10; i++) arc(i / 10 + Math.random() * 0.05, 14 + Math.random() * 14 * strength, 260);
              }
            } else step.fired = false;
            raf = requestAnimationFrame(step);
          })(t0);
        }
      }

      var shown = 'storm';
      document.getElementById('strength').addEventListener('input', function (e) {
        strength = parseFloat(e.target.value);
        document.getElementById('strength-val').textContent = strength.toFixed(1);
        show(shown);
      });
      document.querySelectorAll('.tabs button').forEach(function (b) {
        b.addEventListener('click', function () { shown = b.getAttribute('data-fx'); show(shown); });
      });
      show('storm');

      // ---------- the slam: lift, hit the table, shock ----------
      var stage = document.getElementById('stage');
      var card = document.getElementById('card');
      var busy = false;

      // a low, short thud (Web Audio, made on the spot: no sound file)
      function thud() {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        var ctx = thud.ctx || (thud.ctx = new Ctx());
        var t = ctx.currentTime;
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(38, t + 0.25);
        gain.gain.setValueAtTime(0.9, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.4);
        // the slap on the felt: a burst of noise
        var len = Math.floor(ctx.sampleRate * 0.06);
        var buf = ctx.createBuffer(1, len, ctx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
        var src = ctx.createBufferSource();
        var g2 = ctx.createGain();
        g2.gain.value = 0.5;
        src.buffer = buf;
        src.connect(g2).connect(ctx.destination);
        src.start(t);
      }

      function burst(x, y) {
        for (var i = 0; i < 18; i++) {
          var s = document.createElement('span');
          s.className = 'spark';
          s.style.left = x + 'px';
          s.style.top = y + 'px';
          stage.appendChild(s);
          var a = -Math.PI * (0.05 + Math.random() * 0.9); // upward and sideways, off the table
          var d = 50 + Math.random() * 80;
          var tx = Math.cos(a) * d, ty = Math.sin(a) * d;
          s.animate([
            { transform: 'translate(0,0) scale(1)', opacity: 1 },
            { transform: 'translate(' + tx * 0.7 + 'px,' + ty * 0.8 + 'px) scale(0.8)', opacity: 0.9, offset: 0.5 },
            { transform: 'translate(' + tx + 'px,' + (ty * 0.6 + 18) + 'px) scale(0.2)', opacity: 0 }
          ], { duration: 650 + Math.random() * 350, easing: 'cubic-bezier(0.2, 0.6, 0.4, 1)' }).onfinish = s.remove.bind(s);
        }
      }

      // One timeline (no chained steps, so nothing stutters between them), 720ms:
      // lift and lean back (0 → 300ms, easing out), hold a beat, drop with acceleration and
      // land at 430ms, a soft squash and settle with a small overshoot. The shock (shake, glow,
      // ring, sparks, thud, vibration) is timed to the landing.
      var LAND = 430, TOTAL = 720;
      document.getElementById('apply').addEventListener('click', function () {
        if (busy) return;
        busy = true;
        var k = function (ms) { return ms / TOTAL; };
        card.animate([
          { transform: 'translateY(0) scale(1) rotateX(0deg)', filter: 'brightness(1)', easing: 'cubic-bezier(0.2, 0.8, 0.3, 1)' },
          { transform: 'translateY(-22px) scale(1.1) rotateX(12deg)', filter: 'brightness(1.2)', offset: k(300), easing: 'linear' },
          { transform: 'translateY(-24px) scale(1.11) rotateX(13deg)', filter: 'brightness(1.22)', offset: k(340), easing: 'cubic-bezier(0.55, 0, 0.9, 0.5)' },
          { transform: 'translateY(4px) scale(0.97, 0.95) rotateX(0deg)', filter: 'brightness(1.35)', offset: k(LAND), easing: 'cubic-bezier(0.2, 0.7, 0.3, 1)' },
          { transform: 'translateY(-2px) scale(1.012, 1.01)', filter: 'brightness(1.1)', offset: k(560), easing: 'cubic-bezier(0.4, 0, 0.3, 1)' },
          { transform: 'translateY(0) scale(1) rotateX(0deg)', filter: 'brightness(1)' }
        ], { duration: TOTAL }).onfinish = function () { busy = false; };

        if (document.getElementById('opt-sound').checked) setTimeout(thud, LAND - 10);
        setTimeout(function () {
          // a softer, decaying shake: three swings, each smaller
          stage.animate([
            { transform: 'translate(0, 0)' },
            { transform: 'translate(0, 5px)', offset: 0.18 },
            { transform: 'translate(-2px, -3px)', offset: 0.4 },
            { transform: 'translate(1px, 1.5px)', offset: 0.65 },
            { transform: 'translate(0, 0)' }
          ], { duration: 380, easing: 'cubic-bezier(0.3, 0.6, 0.4, 1)' });
          // a warm glow instead of a hard flash
          document.getElementById('flash').animate([{ opacity: 0 }, { opacity: 0.22, offset: 0.2 }, { opacity: 0 }],
            { duration: 420, easing: 'ease-out' });
          var r = card.getBoundingClientRect(), sr = stage.getBoundingClientRect();
          var x = r.left - sr.left + r.width / 2, y = r.top - sr.top + r.height * 0.88;
          [0, 90].forEach(function (delay, i) {
            var ring = document.createElement('span');
            ring.className = 'ring';
            ring.style.left = x + 'px';
            ring.style.top = y + 'px';
            stage.appendChild(ring);
            ring.animate([
              { transform: 'scale(0.5) scaleY(0.32)', opacity: i ? 0.5 : 0.9 },
              { transform: 'scale(' + (i ? 4.2 : 5.8) + ') scaleY(0.32)', opacity: 0 }
            ], { duration: 820, delay: delay, easing: 'cubic-bezier(0.15, 0.6, 0.25, 1)', fill: 'backwards' })
              .onfinish = ring.remove.bind(ring);
          });
          burst(x, y);
          if (document.getElementById('opt-buzz').checked && navigator.vibrate) navigator.vibrate([25, 30, 60]);
        }, LAND);
      });
    })();
  </script>
</body>
</html>
