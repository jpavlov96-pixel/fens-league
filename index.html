<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фенска Лига DEMO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Figma: "1.0 - Lobby Main" (329:12817), the site's landing page and the stand-in for the
       rest of the site: Sport, Casino, Live Casino, Virtuals and eSport all open this page
       (?tab= says which; Sport without one), outside the product. "Fens League" pulses to draw the tap; it leads to the lobby, where the
       ball's intro plays (coming from outside the product, see components/page-boot.js). -->
  <div class="lobby-main demo-page">

    <!-- Figma: gradient-bgr (329:12820) -->
    <div class="gradient-bgr" aria-hidden="true"></div>

    <!-- Figma: header (329:13389); the same links as on the product's pages -->
    <header class="mobile-header">
      <div class="app-header">
        <div class="app-header__left">
          <a class="promo-item" href="#offers">Offers</a>
        </div>
        <div class="app-header__right">
          <a class="sign-up" href="#signup">Sign up</a>
          <a class="sign-in" href="#signin">Sign In</a>
        </div>
        <a class="logo" href="index.html" aria-label="EGT Digital">
          <span class="brand-logo"><img src="assets/lobby-main/egt-digital-logo.svg" alt="EGT Digital"></span>
        </a>
      </div>

      <nav class="sub-header" aria-label="Main">
        <div class="sub-header__items">
          <a class="nav-link is-active" href="index.html?tab=sport" data-tab="sport" aria-current="page">Sport</a>
          <!-- Figma says "Fen League"; the user renamed it -->
          <a class="nav-link nav-link--lure" href="lobby.html"><span class="nav-link__shine">Fens League</span><span class="nav-link__badge">NEW</span></a>
          <a class="nav-link" href="index.html?tab=casino" data-tab="casino">Casino</a>
          <a class="nav-link" href="index.html?tab=live-casino" data-tab="live-casino">Live Casino</a>
          <a class="nav-link" href="index.html?tab=virtuals" data-tab="virtuals">Virtuals</a>
          <a class="nav-link" href="index.html?tab=esport" data-tab="esport">eSport</a>
        </div>
      </nav>
    </header>

    <!-- Figma: "Фенска Лига DEMO" (329:12822) -->
    <h1 class="demo-title">Фенска Лига<br>DEMO</h1>
  </div>

  <script>
    // The section you came for is the active link (Sport when none is given)
    (function () {
      var tab = new URLSearchParams(window.location.search).get('tab') || 'sport';
      var links = document.querySelectorAll('.nav-link[data-tab]');
      var match = document.querySelector('.nav-link[data-tab="' + tab + '"]') || links[0];
      links.forEach(function (link) {
        var on = link === match;
        link.classList.toggle('is-active', on);
        if (on) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
    })();
  </script>
</body>
</html>
